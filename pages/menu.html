<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- meta information -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Thomas Mairella">
        <meta name="description" content="A cozy cafe menu for warm drinks and comfort food.">
        <title>Our Menu</title>
        <link rel="stylesheet" href="../css/style.css">
        <link rel="icon" type="image/svg+xml" href="../images/icon.svg">
        <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <!-- header for page -->
        <header>
            <h1><a href="../index.html" class="home">Cozy Cafe</a></h1>
            <nav>
                <a href="../pages/menu.html" class="navigation">Menu</a>
                <a href="../pages/reserve.html" class="navigation">Reservations</a>
                <a href="../pages/contact.html" class="navigation">Contact Us</a>
            </nav>
            <hr>
        </header>

        <main>
            <h1 class="pagehead">Our Menu</h1>
            <p class="menu-intro">Fresh favorites for slow mornings, sweet sips, and cozy afternoons.</p>
            <section class="menu-grid" aria-label="Cafe menu">
                <figure class="menu-item">
                    <img src="../images/vlatte.jpg" alt="A freshly made coffee topped with milk foam" loading="lazy">
                    <figcaption>
                        <span class="menu-item-heading">Vanilla Latte</span>
                        <span class="menu-price">$4.50</span>
                        <span class="menu-description">Espresso and steamed milk with a touch of vanilla.</span>
                    </figcaption>
                </figure>
                <figure class="menu-item">
                    <img src="../images/atoast.jpg" alt="Avocado toast topped with fresh ingredients" loading="lazy">
                    <figcaption>
                        <span class="menu-item-heading">Garden Avocado Toast</span>
                        <span class="menu-price">$9.00</span>
                        <span class="menu-description">Sourdough, smashed avocado, greens, and chili flakes.</span>
                    </figcaption>
                </figure>
                <figure class="menu-item">
                    <img src="../images/butterc.jpg" alt="Golden, flaky croissants fresh from the bakery" loading="lazy">
                    <figcaption>
                        <span class="menu-item-heading">Butter Croissant</span>
                        <span class="menu-price">$3.75</span>
                        <span class="menu-description">A flaky, buttery pastry baked fresh each morning.</span>
                    </figcaption>
                </figure>
                <figure class="menu-item">
                    <img src="../images/berryp.jpg" alt="A stack of pancakes served with berries" loading="lazy">
                    <figcaption>
                        <span class="menu-item-heading">Berry Pancakes</span>
                        <span class="menu-price">$10.50</span>
                        <span class="menu-description">Fluffy buttermilk pancakes with seasonal berries.</span>
                    </figcaption>
                </figure>
            </section>
        </main>

        <!-- footer for page -->
        <footer>
            <hr>
            <p class="copyright">Created by Thomas Mairella. &copy; 2026 All Rights Reserved.</p>
        </footer>
    </body>
</html>
